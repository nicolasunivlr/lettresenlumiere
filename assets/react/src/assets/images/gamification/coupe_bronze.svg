<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Trophée en bronze" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Trophée en bronze</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3b17"/>
      <stop offset="0.25" stop-color="#e59a5c"/>
      <stop offset="0.45" stop-color="#f8c898"/>
      <stop offset="0.7" stop-color="#b06a2e"/>
      <stop offset="1" stop-color="#6e3b17"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e59a5c"/>
      <stop offset="1" stop-color="#6e3b17"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#43220b"/>
      <stop offset="1" stop-color="#b06a2e"/>
    </radialGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="200" cy="462" rx="130" ry="10" fill="#000" opacity="0.18"/>

  <!-- Anses -->
  <path d="M104 96 C30 92 30 205 118 208" fill="none" stroke="#43220b" stroke-width="18" stroke-linecap="round"/>
  <path d="M104 96 C30 92 30 205 118 208" fill="none" stroke="url(#metalV)" stroke-width="12" stroke-linecap="round"/>
  <path d="M296 96 C370 92 370 205 282 208" fill="none" stroke="#43220b" stroke-width="18" stroke-linecap="round"/>
  <path d="M296 96 C370 92 370 205 282 208" fill="none" stroke="url(#metalV)" stroke-width="12" stroke-linecap="round"/>

  <!-- Pied et nœud -->
  <rect x="184" y="262" width="32" height="78" fill="url(#metal)"/>
  <ellipse cx="200" cy="300" rx="26" ry="11" fill="url(#metal)" stroke="#43220b" stroke-width="1.5"/>

  <!-- Piédestal -->
  <path d="M140 348 H260 L282 402 H118 Z" fill="url(#metal)" stroke="#43220b" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="342" rx="34" ry="9" fill="url(#metal)" stroke="#43220b" stroke-width="1.5"/>

  <!-- Socle -->
  <rect x="100" y="402" width="200" height="46" rx="7" fill="url(#metal)" stroke="#43220b" stroke-width="1.5"/>
  <rect x="140" y="414" width="120" height="22" rx="3" fill="#43220b" opacity="0.85"/>
  <rect x="146" y="420" width="108" height="10" rx="2" fill="url(#metalV)" opacity="0.9"/>

  <!-- Coupe -->
  <path d="M96 78 H304 C304 190 268 252 200 272 C132 252 96 190 96 78 Z" fill="url(#metal)" stroke="#43220b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Reflet -->
  <path d="M120 96 C122 170 146 218 176 240" fill="none" stroke="#f8c898" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- Bord -->
  <ellipse cx="200" cy="78" rx="104" ry="16" fill="url(#rim)" stroke="#43220b" stroke-width="2"/>
  <ellipse cx="200" cy="78" rx="104" ry="16" fill="none" stroke="#f8c898" stroke-width="1.5" opacity="0.6" transform="translate(0 -1)"/>

  <!-- Étoile -->
  <polygon points="200.0,114.0 210.6,143.4 241.8,144.4 217.1,163.6 225.9,193.6 200.0,176.0 174.1,193.6 182.9,163.6 158.2,144.4 189.4,143.4" fill="#43220b" opacity="0.9"/>
  <polygon points="200.0,120.0 208.8,145.9 236.1,146.3 214.3,162.6 222.3,188.7 200.0,173.0 177.7,188.7 185.7,162.6 163.9,146.3 191.2,145.9" fill="url(#metalV)" stroke="#f8c898" stroke-width="1" stroke-linejoin="round"/>
</svg>
